<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">

<style>

#s3 .hd b.nm{color:var(--org);font-size:24px;font-weight:700}#s3 .fl,#s3 .fl li{color:var(--bad)}#s3 .note{color:var(--blue)}#s3 .note .ts{color:var(--mut)}

</style></head>
<body><main>
<header><h1>交易追蹤與復盤</h1>
<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center"><label style="flex-direction:row;align-items:center;gap:8px">總本金（元）<input id="cap" type="number" style="width:120px"></label><span id="st" class="m"></span><button class="btn ghost sm" id="syncNow" type="button" style="display:none">↻ 立即同步</button><button class="btn ghost sm" id="syncBtn" type="button">☁️ 同步設定</button></div></header>

<h2>一、個股追蹤表</h2>
<div class="idea"><label>預備操作想法（隨時修改，自動儲存，約 200 字內）<textarea id="idea" rows="3" placeholder="例如：台積電回到買點一以下先買…"></textarea><span class="cnt m" id="ideac">0 / 200 字</span></label></div>
<p class="sub" style="height:48px"></p>
<div class="wrap"><table id="tb"></table></div>
<p style="margin:10px 0 0"><button class="btn ghost" data-a="addrow" style="font-size:14px">＋ 新增一列</button> <button class="btn ghost" data-a="pxnow" style="font-size:14px">↻ 立即更新收盤價</button><span id="pxs" class="m"></span></p>

<h2>二、新增交易記錄</h2>
<div class="card" id="tf"></div>

<h2>三、進行中的交易 <span id="n1" class="m"></span></h2>
<div id="s3"><p class="sub" style="margin-bottom:0">資金水位（進行中的交易，以總本金計算）</p><div class="card" id="lv" style="margin-top:8px"></div>
<div id="op"></div></div>

<h2>四、完整交易報告 <span id="n2" class="m"></span></h2>
<div id="dn"></div>
</main>
<dialog id="syncDlg">
<h3>☁️ GitHub 私人 Gist 跨裝置同步</h3>
<ol>
<li>前往 GitHub → Settings → Developer settings → Personal access tokens（Fine-grained 或 Classic）。</li>
<li>權限只需勾選 <b>Gists（Read and write）</b>。</li>
<li>將產生的 Token 貼到下方；其他裝置／瀏覽器貼入<b>同一組 Token</b> 即可自動同步。</li>
</ol>
<label>GitHub Personal Access Token
<input id="ghTok" type="password" placeholder="github_pat_... 或 ghp_..." autocomplete="off">
</label>
<div id="syncMeta" class="ts" style="margin-top:8px"></div>
<div id="histWrap" style="display:none">
<div style="display:flex;align-items:center;justify-content:space-between"><span style="font-size:14px;font-weight:600">雲端歷史版本（Gist Revisions）</span><button class="btn ghost sm" id="histLoad" type="button">↻ 重新載入</button></div>
<div id="histList"></div>
</div>
<div id="syncMsg" class="m"></div>
<div class="row">
<button class="btn ghost sm" id="syncClr" type="button">清除設定</button>
<button class="btn ghost sm" id="syncClose" type="button">關閉</button>
<button class="btn sm" id="syncSave" type="button">儲存並同步</button>
</div>
</dialog>
<script>
const K='tj1',$=id=>document.getElementById(id),num=v=>{const x=parseFloat(v);return isFinite(x)?x:null},
esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
money=n=>'NT$ '+Math.round(n).toLocaleString('en-US'),
fmt=t=>new Date(t).toLocaleString('zh-TW',{hour12:false,month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}),
blank=()=>({capital:920000,stocks:Array.from({length:22},()=>({})),trades:[],ts:0}),
st=s=>$('st').textContent=s;
let S=blank(),ref=null,tmr;
function norm(){while(S.stocks.length<22)S.stocks.push({});while(S.stocks.length>22&&!Object.entries(S.stocks[S.stocks.length-1]).some(([k,v])=>k!=='eb'&&v))S.stocks.pop();S.trades=S.trades||[];S.trades.forEach(t=>{t.notes=t.notes||[];t.draft=t.draft||{}})}
try{const o=JSON.parse(localStorage.getItem(K));if(o){S=o;norm()}}catch(e){}
const T=id=>S.trades.find(t=>t.id===id);

/* 個股追蹤表 */
function pdate(v){const m=String(v||'').match(/^(\d{2}|\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);if(!m)return null;let y=+m[1];if(y<100)y+=2000;const d=new Date(y,m[2]-1,m[3]);return isNaN(d)?null:d}
function dd(v){const d=pdate(v);return d?String(d.getFullYear()).slice(2)+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0'):(v||'')}
const C=[['n','個股名稱','text'],['d','低點日','text'],['low','低點價位','number'],['px','最新收盤價','number'],['b1','買點一價位'],['b2','買點二價位'],['r','買賣差率'],['e26','2026eps','number'],['e27','2027eps','number'],['p1','買點一 P/E','number'],['p2','買點二 P/E','number'],['note','備註','text'],['eb','買點採用 EPS','sel']];
function build(){
 $('idea').value=S.idea||'';$('ideac').textContent=(S.idea||'').length+' / 200 字';const W=[92,88,84,84,84,84,84,76,76,88,88,210,104];$('tb').innerHTML='<colgroup>'+W.map(w=>`<col style="width:${w}px">`).join('')+'</colgroup><tr>'+C.map(c=>`<th>${c[1]}</th>`).join('')+'</tr>'+S.stocks.map((s,i)=>'<tr>'+C.map(c=>c[2]==='sel'?`<td><select data-r="${i}" data-k="eb"><option value="27"${s.eb!=='26'?' selected':''}>2027 EPS</option><option value="26"${s.eb==='26'?' selected':''}>2026 EPS</option></select></td>`:c[2]?`<td${EK.includes(c[0])?' class="eh"':''}><input data-r="${i}" data-k="${c[0]}" type="${c[2]}" step="any" value="${esc(c[0]==='d'?dd(s.d):s[c[0]])}"${c[0]==='d'?' placeholder="YY/MM/DD"':''}>${EK.includes(c[0])?`<span class="ec" id="ec${c[0]}_${i}"></span>`:''}</td>`:`<td class="c" id="${c[0]}_${i}"></td>`).join('')+'</tr>').join('');
 S.stocks.forEach((_,i)=>upd(i))}
function upd(i){
 const s=S.stocks[i],e=num(s.eb==='26'?s.e26:s.e27),a=num(s.p1),b=num(s.p2),p=num(s.px),
 b1=e!=null&&a!=null?e*a:null,b2=e!=null&&b!=null?e*b:null,r=p&&b1!=null?(p-b1)/p*100:null,
 R2=x=>x==null?'—':String(Math.round(x*100)/100);
 $('b1_'+i).textContent=R2(b1);$('b2_'+i).textContent=R2(b2);
 const rc=$('r_'+i);rc.textContent=r==null?'—':r.toFixed(1)+'%';rc.classList.toggle('w5',r!=null&&r<=7);const pc=document.querySelector('[data-r="'+i+'"][data-k="px"]').parentElement,i2=p!=null&&b2!=null&&p<=b2,i1=p!=null&&b1!=null&&p<=b1;pc.classList.toggle('in2',i2);pc.classList.toggle('in1',i1&&!i2);const dp=pdate(s.d),dc=document.querySelector('[data-r="'+i+'"][data-k="d"]').parentElement;dc.classList.toggle('rc',!!dp&&dp<=Date.now()&&(Date.now()-dp)/864e5<=30);EK.forEach(k=>updE(i,k))}
/* EPS 修改紀錄：每欄保留最近 10 次；最近連續 3 次以上同方向（上調或下修）顯示紅色 */
const EK=['e26','e27'];
function streak(h){let n=0,d=0;for(let j=h.length-1;j>=0;j--){const x=Math.sign(h[j].to-h[j].from);if(!x)break;if(!d)d=x;if(x!==d)break;n++}return n}
function updE(i,k){const s=S.stocks[i],h=s['h'+k]||[],td=$('ec'+k+'_'+i);if(!td)return;const n=h.length,sk=streak(h),up=n&&h[n-1].to>h[n-1].from;
 td.textContent=n?n:'';td.parentElement.classList.toggle('eu',sk>=3);
 td.parentElement.title=n?(k==='e26'?'2026':'2027')+' EPS 修改紀錄（最近 '+n+' 次）\n'+h.map(x=>fmt(x.ts)+'　'+x.from+' → '+x.to+(x.to>x.from?' ↑':' ↓')).join('\n')+(sk>=3?'\n⚠ 連續'+(up?'上調':'下修')+' '+sk+' 次':''):''}
function logE(i,k,o,v){const a=num(o),b=num(v);if(a==null||b==null||a===b)return;const s=S.stocks[i],h=s['h'+k]||(s['h'+k]=[]);h.push({ts:Date.now(),from:a,to:b});while(h.length>10)h.shift();updE(i,k)}

/* 新增交易表單 */
const HP=['搶反彈（1–5 天）','短線（1 個月內）','波段（1–3 個月）','中期（3–12 個月）','長期（1 年以上）'],EMO=['冷靜','怕錯過','無腦','攤平','害怕','恐懼','興奮'],emoT=x=>Array.isArray(x.emo)?x.emo.join('、'):(x.emo||''),O=(a,ph)=>(ph?'<option value="">請選擇</option>':'')+a.map(v=>`<option>${v}</option>`).join(''),
F=(id,l,t='text')=>`<label>${l}<input id="f-${id}" type="${t}" step="any"></label>`,
Sel=(id,l,a,ph)=>`<label>${l}<select id="f-${id}">${O(a,ph)}</select></label>`;
$('tf').innerHTML=`<fieldset><legend>標的與部位</legend><div class="g">${F('name','投資標的')}${F('buyDate','買入日','date')}${F('price','買入價','number')}${F('qty','股數','number')}<label>總金額（自動）<input id="f-total" readonly></label>${Sel('hold','持有時期',HP)}</div></fieldset>
<fieldset><legend>情緒檢查（可複選）</legend><div class="emo">${EMO.map(v=>`<label class="ck"><input type="checkbox" name="emo" value="${v}">${v}</label>`).join('')}</div></fieldset>
<fieldset><legend>買入條件</legend><div class="g3">${F('c1','買入條件 (1)')}${F('c2','買入條件 (2)')}${F('c3','買入條件 (3)')}</div></fieldset>
<fieldset><legend>失效條件</legend><div class="g3">${F('f1','失效條件 (1)')}${F('f2','失效條件 (2)')}${F('f3','失效條件 (3)')}</div></fieldset>
<fieldset><legend>後續補充說明</legend><textarea id="f-note" rows="3" placeholder="買入當下的想法…"></textarea></fieldset>
<p id="warn" class="m" style="margin:0 0 10px"></p><button class="btn" data-a="submit">送出</button> <span id="msg" class="bad"></span>`;
function fc(){
 const p=num($('f-price').value),q=num($('f-qty').value),tot=p!=null&&q!=null?p*q:null,w=[];
 $('f-total').value=tot==null?'':Math.round(tot*100)/100;
 if(tot!=null&&S.capital){const op=S.trades.filter(t=>!t.closed&&!t.mergedInto),inv=op.reduce((a,t)=>a+t.price*t.qty,0),h=$('f-hold').value,hs=op.filter(t=>t.hold===h).reduce((a,t)=>a+t.price*t.qty,0)+tot,cash=S.capital-inv-tot;w.push('占本金 '+(tot/S.capital*100).toFixed(1)+'%','買入後現金 '+money(cash)+'（'+(cash/S.capital*100).toFixed(1)+'%）',h.split('（')[0]+'水位 '+money(hs)+'（'+(hs/S.capital*100).toFixed(1)+'%）')}
 $('warn').textContent=w.join('　')}
function today(){return new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function sub(){
 const v=id=>$('f-'+id).value.trim(),name=v('name'),price=num(v('price')),qty=num(v('qty')),emo=[...$('tf').querySelectorAll('input[name=emo]:checked')].map(x=>x.value);
 if(!name||price==null||qty==null||!emo.length){$('msg').textContent='請至少填寫：投資標的、買入價、股數、情緒檢查';return}
 $('msg').textContent='';
 const t={id:'t'+Date.now(),ts:Date.now(),name,buyDate:v('buyDate'),price,qty,hold:v('hold'),emo,c:[v('c1'),v('c2'),v('c3')],f:[v('f1'),v('f2'),v('f3')],notes:[],closed:null,mergedInto:null,draft:{}};
 if(v('note'))t.notes.push({ts:Date.now(),text:v('note')});
 S.trades.unshift(t);
 $('tf').querySelectorAll('input,textarea').forEach(x=>{if(x.type==='checkbox')x.checked=false;else if(!x.readOnly||x.id==='f-total')x.value=''});
 $('tf').querySelectorAll('select').forEach(x=>x.selectedIndex=0);
 $('f-buyDate').value=today();fc();dirty();R()}

/* 交易卡片 */
const li=a=>(a||[]).filter(Boolean).map(s=>`<li>${esc(s)}</li>`).join('')||'<li class="m">未填</li>';
function body(x){

const twNow=()=>{const d=new Date(Date.now()+8*3600e3),p=n=>String(n).padStart(2,'0');return{d,wd:d.getUTCDay(),min:d.getUTCHours()*60+d.getUTCMinutes(),ds:d.getUTCFullYear()+p(d.getUTCMonth()+1)+p(d.getUTCDate())}},
 dsAdd=(ds,n)=>{const d=new Date(Date.UTC(+ds.slice(0,4),+ds.slice(4,6)-1,+ds.slice(6))+n*864e5);return d.toISOString().slice(0,10).replace(/-/g,'')},

function target(){const n=twNow();let ds=n.ds,wd=n.wd;if(wd>=1&&wd<=5&&n.min>=T0)return ds;do{ds=dsAdd(ds,-1);wd=(wd+6)%7}while(wd===0||wd===6);return ds}
async function twse(ds){const r=await fetch('https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?type=ALLBUT0999&response=json&date='+ds,{cache:'no-store'}),j=await r.json();
 const tb=(j.tables||[]).find(t=>t.fields&&t.fields[0]==='證券代號'&&t.data&&t.data.length);return tb?tb.data.map(x=>({c:x[0],n:x[1],p:num(String(x[8]).replace(/,/g,''))})).filter(x=>x.p!=null):null}
async function tpex(ds){try{const r=await fetch('https://www.tpex.org.tw/web/stock/aftertrading/daily_close_quotes/stk_quote_result.php?l=zh-tw&o=json&d='+(+ds.slice(0,4)-1911)+'/'+ds.slice(4,6)+'/'+ds.slice(6),{cache:'no-store'}),j=await r.json(),tb=(j.tables||[])[0];

function pick(L,s){const n=(s.n||'').trim();return L.find(x=>s.code&&x.c===s.code)||L.find(x=>x.c===n||x.n===n)||L.find(x=>n.length>=2&&x.n.startsWith(n))}
async function pxUpdate(day){
 if(pxBusy)return;pxBusy=true;pxTry=Date.now();pxStat('更新中…');
 try{let ds=day,L=null;for(let k=0;k<10&&!L;k++){if(k){await new Promise(r=>setTimeout(r,2000));do{ds=dsAdd(ds,-1)}while([0,6].includes(new Date(Date.UTC(+ds.slice(0,4),+ds.slice(4,6)-1,+ds.slice(6))).getUTCDay()))}L=await twse(ds)}
  if(!L){pxStat('無法取得證交所資料');return}
  const miss=[];let L2=null;
  for(const [i,s] of S.stocks.entries()){if(!(s.n||'').trim())continue;let m=pick(L,s);
   if(!m){if(L2===null)L2=(await tpex(ds))||[];m=pick(L2,s)}
   if(!m){miss.push(s.n);continue}
   s.code=m.c;s.px=String(m.p);const el=document.querySelector('[data-r="'+i+'"][data-k="px"]');if(el&&document.activeElement!==el)el.value=s.px;upd(i)}
  S.pxDate=ds;S.pxAt=Date.now();const n=twNow();
  if(ds===day||day<n.ds||n.min>=T1)S.pxFor=day;dirty();
  pxStat((ds!==day?'（'+dsFmt(day)+' 尚無資料，顯示最近有效收盤日）':'')+(miss.length?'未能自動更新：'+miss.join('、')+'（上櫃或名稱不符，請手動輸入）':''))
 }catch(e){pxStat('更新失敗（'+(e.message||'網路錯誤')+'）')}
 finally{pxBusy=false;pxSched()}}
function pxSched(){clearTimeout(pxT);const n=twNow(),day=target();
 if(S.pxFor!==day){if(!pxBusy){const wait=pxTry&&Date.now()-pxTry<5*6e4?5*6e4-(Date.now()-pxTry):0;pxT=setTimeout(()=>pxUpdate(day),wait)}return}
 let ds=n.ds,wd=n.wd,add=0;if(!(wd>=1&&wd<=5&&n.min<T0)){do{ds=dsAdd(ds,1);wd=(wd+1)%7;add++}while(wd===0||wd===6)}
 const ms=(add*1440+T0-n.min)*6e4-n.d.getUTCSeconds()*1e3+1e3;pxT=setTimeout(pxSched,Math.min(ms,6*3600e3))}

async function syncPull(quiet){
 if(syncBusy||!ghCfg().token)return;
 syncBusy=true;if(!quiet)st('同步中…');
 try{
  const g=await findOrCreateGist(),f=g.files&&g.files[GIST_FILE];
  if(f&&f.content){
   const o=JSON.parse(f.content);
   if((o.ts||0)>(S.ts||0))applyRemote(o);
   else if((S.ts||0)>(o.ts||0))await ghReq('/gists/'+g.id,{method:'PATCH',body:JSON.stringify({files:{[GIST_FILE]:{content:JSON.stringify(S)}}})})}
  else if(S.ts){await ghReq('/gists/'+g.id,{method:'PATCH',body:JSON.stringify({files:{[GIST_FILE]:{content:JSON.stringify(S)}}})})}
  cloudPending=false;lastSyncAt=Date.now();st('已同步 · GitHub Gist（'+fmt(lastSyncAt)+'）')
 }catch(e){if(!quiet)st('同步失敗（'+(e.message||'網路錯誤')+'），已存於本機');throw e}
 finally{syncBusy=false;updSyncBtn()}}

 return j}
async function pushCloud(){

 if(!c.token)return;
 syncBusy=true;st('雲端同步中…');
 try{
  if(!c.gistId)await findOrCreateGist();
  const id=ghCfg().gistId;
  await ghReq('/gists/'+id,{method:'PATCH',body:JSON.stringify({files:{[GIST_FILE]:{content:j}}})});
  cloudPending=false;lastSyncAt=Date.now();st('已同步 · GitHub Gist（'+fmt(lastSyncAt)+'）')
 }catch(e){st('雲端同步失敗（'+(e.message||'網路錯誤')+'），已存於本機')}
 finally{syncBusy=false}}

async function loadHistory(){
 const c=ghCfg(),box=$('histList');
 if(!c.token){$('histWrap').style.display='none';return}
 $('histWrap').style.display='block';box.innerHTML='<div class="ts">載入歷史版本中…</div>';
 try{
  if(!c.gistId)await findOrCreateGist();
  const id=ghCfg().gistId,list=await ghReq('/gists/'+id+'/commits?per_page=15');
  if(!list.length){box.innerHTML='<div class="ts">尚無歷史版本</div>';return}
  box.innerHTML=list.map((h,i)=>{
   const t=new Date(h.committed_at).toLocaleString('zh-TW',{hour12:false,month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
   return `<div class="hitem"><span>${esc(t)} <span class="m">(${esc(h.version.slice(0,7))})</span>${i===0?' <span class="ok">最新</span>':''}</span><button class="btn ghost sm" type="button" data-sha="${esc(h.version)}" data-t="${esc(t)}">還原此版</button></div>`;
  }).join('');
 }catch(e){box.innerHTML='<div class="bad" style="font-size:13px">無法載入歷史：'+esc(e.message||'網路錯誤')+'</div>'}
}
$('histLoad').onclick=loadHistory;
$('histList').onclick=async e=>{
 const btn=e.target.closest('[data-sha]');if(!btn)return;
 const sha=btn.dataset.sha,t=btn.dataset.t;
 if(!confirm('確定要還原到 '+t+' 的版本嗎？\n（目前的資料仍會保留在雲端歷史紀錄中）'))return;
 $('syncMsg').className='m';$('syncMsg').textContent='還原版本中…';btn.disabled=true;
 try{
  const c=ghCfg(),g=await ghReq('/gists/'+c.gistId+'/'+sha),f=g.files&&g.files[GIST_FILE];
  if(!f||!f.content)throw new Error('該版本找不到資料檔');
  const o=JSON.parse(f.content);o.ts=Date.now();
  applyRemote(o);await save();await loadHistory();
  $('syncMsg').className='ok';$('syncMsg').textContent='已還原至 '+t+' 的版本！';
 }catch(err){$('syncMsg').className='bad';$('syncMsg').textContent='還原失敗：'+(err.message||'網路錯誤')}
 finally{btn.disabled=false}
};
